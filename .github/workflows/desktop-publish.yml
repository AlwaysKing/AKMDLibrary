name: Build macOS Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build desktop app
        env:
          AKMDL_DESKTOP_OUT: ${{ runner.temp }}/akmdl-desktop
          AKMDL_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: ./scripts/build-desktop-macos.sh

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent "${{ runner.temp }}/akmdl-desktop/AKMDLibrary.app" "${{ runner.temp }}/AKMDLibrary-macos.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AKMDLibrary-macos
          path: ${{ runner.temp }}/AKMDLibrary-macos.zip
